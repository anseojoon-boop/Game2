<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>인관심 7조 과제</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="story.js"></script>
    <script defer src="game.js"></script>
  </head>
  <body>
    <main class="game" id="game">
      <div class="scene" id="scene" aria-label="게임 장면">
        <img class="background" id="background" alt="">
        <div class="scene-shade"></div>
        <img class="portrait" id="portrait" alt="">
        <div class="topbar">
          <div class="brand"><span class="brand-mark">✦</span> 인관심 7조 과제 <small>첫 만남 · 카페</small></div>
        </div>
        <div class="hud" id="affection" role="meter" aria-label="호감도" aria-valuemin="-4" aria-valuemax="4" aria-valuenow="0" hidden>
          <img class="affection-heart" src="assets/affection-heart.png" alt="">
          <div class="affection-content">
            <div class="affection-head"><span id="partner-label"></span><strong id="affection-value">0</strong></div>
            <div class="gauge-track" aria-hidden="true">
              <span class="gauge-fill gauge-negative" id="affection-negative"></span>
              <span class="gauge-fill gauge-positive" id="affection-positive"></span>
              <img class="gauge-frame" src="assets/affection-gauge.svg" alt="">
            </div>
          </div>
        </div>
        <section class="dialogue" aria-live="polite">
          <div class="speaker" id="speaker"></div>
          <p class="line" id="line"></p>
          <div class="choices" id="choices"></div>
          <p class="status" id="status" role="status" aria-live="polite"></p>
          <div class="dialogue-footer">
            <div class="controls">
              <button id="save-button" type="button">저장</button>
              <button id="load-button" type="button">불러오기</button>
              <button id="restart-button" type="button">처음부터</button>
            </div>
            <button class="next" id="next-button" type="button">다음 <span aria-hidden="true">›</span></button>
          </div>
        </section>
      </div>
    </main>

  </body>
</html>
